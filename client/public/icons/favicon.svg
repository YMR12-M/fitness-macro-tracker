  <g transform="rotate(-90 32 32)" fill="none" stroke="#080808" stroke-width="6.5" stroke-linecap="round">
    <circle cx="32" cy="32" r="18" stroke-dasharray="40.80 72.30"/>
    <circle cx="32" cy="32" r="18" stroke-dasharray="24.48 88.62" stroke-dashoffset="-51.30"/>
    <circle cx="32" cy="32" r="18" stroke-dasharray="16.32 96.78" stroke-dashoffset="-86.28"/>
  </g>
  <rect x="22" y="26.5" width="20" height="4.6" rx="2.3" fill="#080808"/>
  <rect x="22" y="33.5" width="12" height="4.6" rx="2.3" fill="#080808"/>
</svg>
