# Local development database. Production points DATABASE_URL at a managed
# MySQL instance instead (PlanetScale, Aiven, AWS RDS, DigitalOcean, ...).
services:
  db:
    image: mysql:8.4
    container_name: fittrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-fittrack}
      MYSQL_USER: ${MYSQL_USER:-fittrack}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fittrack}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - fittrack_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpass}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fittrack_mysql_data:
