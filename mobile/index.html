<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the shell paint under the notch and the home
         indicator; every edge is then padded back with env(safe-area-inset-*).
         maximum-scale is deliberately NOT pinned — disabling pinch-zoom would
         lock out anyone who needs to magnify a number. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#11100d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ebe5d6" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- Installed to the home screen, this should look like an app, not a tab. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FitTrack" />
    <!-- iOS turns bare numbers into call links, which mangles every macro readout. -->
    <meta name="format-detection" content="telephone=no" />

    <meta
      name="description"
      content="Track calories, macros, workouts, body weight and goals on your phone — nutrition data from USDA FoodData Central."
    />

    <title>FitTrack Pro — Mobile</title>

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Display: Big Shoulders (Chicago signage, condensed and heavy) for numbers
         and headings. Text: Libre Franklin. The stencil cut is only the wordmark
         and the sign-in poster, one weight. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@500..900&family=Libre+Franklin:wght@400..700&family=Big+Shoulders+Stencil+Display:wght@800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
